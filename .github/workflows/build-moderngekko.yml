name: Build pinned ModernGekko runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build build-essential pkg-config cmake \
            libevdev-dev libudev-dev libgtk-3-dev libsystemd-dev \
            libbluetooth-dev libasound2-dev libpulse-dev libgl1-mesa-dev \
            libxrandr-dev libxi-dev

      - name: Fetch pinned ModernGekko recursively
        run: |
          set -euxo pipefail
          git init ModernGekko
          git -C ModernGekko remote add origin https://github.com/ExpansionPak/ModernGekko.git
          git -C ModernGekko fetch --depth=1 origin 5417826c31187d4dadf8588c7aa25bf107782936
          git -C ModernGekko checkout --detach FETCH_HEAD
          git -C ModernGekko submodule update --init --recursive --force

          test "$(git -C ModernGekko rev-parse HEAD)" = \
            "5417826c31187d4dadf8588c7aa25bf107782936"

          test "$(git -C ModernGekko/vendor/dolphin rev-parse HEAD)" = \
            "55c7b023fa0f4eba1cf3fdbbb25b1c5ec468d5ac"

      - name: Apply ABI3 compatibility patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("ModernGekko/include/moderngekko/cpu_state.h")
          s = p.read_text()

          assert "#define MODERNGEKKO_CPU_ABI_VERSION 4u" in s
          assert "    int64_t cycle_budget;\n" in s

          s = s.replace(
              "#define MODERNGEKKO_CPU_ABI_VERSION 4u",
              "#define MODERNGEKKO_CPU_ABI_VERSION 3u",
              1,
          )
          s = s.replace("    int64_t cycle_budget;\n", "", 1)

          p.write_text(s)
          PY

          git -C ModernGekko diff -- include/moderngekko/cpu_state.h > abi3.patch

      - name: Configure headless runtime
        run: |
          cmake -S ModernGekko -B ModernGekko/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMODERNGEKKO_ENABLE_DOLPHIN_RUNTIME=ON \
            -DMODERNGEKKO_ENABLE_DOLPHIN_TESTS=OFF \
            -DMODERNGEKKO_ENABLE_DISC_TOOL=OFF \
            -DENABLE_HEADLESS=ON \
            2>&1 | tee moderngekko-configure.log

      - name: Build moderngekko-run
        run: |
          cmake --build ModernGekko/build \
            --target moderngekko-run -j2 \
            2>&1 | tee moderngekko-build.log

      - name: Package runtime
        run: |
          set -euxo pipefail
          mkdir dist

          RUNNER="$(find ModernGekko/build \
            -type f -name moderngekko-run -perm -111 | head -n1)"

          test -n "$RUNNER"

          cp "$RUNNER" dist/moderngekko-run
          cp abi3.patch dist/
          cp moderngekko-configure.log dist/
          cp moderngekko-build.log dist/

          {
            echo "ModernGekko=$(git -C ModernGekko rev-parse HEAD)"
            echo "RecompCore=$(git -C ModernGekko/vendor/dolphin rev-parse HEAD)"
            file "$RUNNER"
            ldd "$RUNNER" || true
          } > dist/BUILD-PROVENANCE.txt

          sha256sum dist/moderngekko-run > dist/moderngekko-run.sha256

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: spm-moderngekko-runtime
          path: dist/
          if-no-files-found: error
          retention-days: 30
